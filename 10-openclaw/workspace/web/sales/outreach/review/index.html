<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Aneeverse Sales • Draft Review</title><link rel="stylesheet" href="/sales/shared-shell.css"><style>.review-list{padding:18px;display:grid;gap:14px}.draft-card{display:grid;gap:12px}.draft-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.draft-copy{padding:14px;border-radius:12px;background:rgba(255,255,255,.02);border:1px solid var(--border)}.draft-copy .body-copy{white-space:pre-wrap}.meta-stack{display:grid;gap:6px}.meta-stack .meta-line{font-size:13px}.contact-link{color:#8fdcc9;font-size:12px}.state-line{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><div class="mobile-top"><strong>Aneeverse Sales</strong><span class="chip">Review</span></div><div class="mobile-nav" id="sales-mobile-nav"></div><div class="layout"><aside class="sidebar" id="sales-sidebar-nav"></aside><main class="main"><div class="topbar"><div><h2>Draft Review</h2><p>Review, approve, reject, or send outreach drafts.</p></div></div><div class="shell"><section class="panel hero"><div class="hero-badge">Approval workflow</div><h3>Review every draft before it goes out.</h3><p>Use this as the human quality checkpoint. Approve strong drafts, push weak ones back, and only send what is actually ready.</p></section><section class="panel"><div id="drafts" class="review-list"><div class="muted">Loading drafts…</div></div></section></div></main></div><script>const API='/sales-api/outreach/drafts';function titleize(value=''){return value.replace(/_/g,' ').replace(/\b\w/g,m=>m.toUpperCase())}function formatRelative(iso){if(!iso) return '—';const date=new Date(iso);if(Number.isNaN(date.getTime())) return iso;const diffMs=Date.now()-date.getTime();const mins=Math.round(Math.abs(diffMs)/60000);if(mins<1) return 'just now';if(mins<60) return `${mins}m ago`;const hours=Math.round(mins/60);if(hours<24) return `${hours}h ago`;const days=Math.round(hours/24);if(days<7) return `${days}d ago`;return date.toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'numeric',minute:'2-digit'})}function badgeClass(outcome=''){const raw=(outcome||'').toLowerCase();if(raw.includes('reject')) return 'danger';if(raw.includes('need')) return 'warn';if(raw.includes('approve')||raw.includes('sent')) return '';return 'neutral'}async function setOutcome(id,outcome){await fetch(`/sales-api/outreach/drafts/${id}/approve`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({outcome,owner:'Ane'})});loadDrafts()}async function sendDraft(id){const r=await fetch(`/sales-api/outreach/drafts/${id}/send`,{method:'POST'});const data=await r.json();if(!r.ok){alert(data.detail||'Send failed');return;}alert(`Sent to ${data.sent_to}`);loadDrafts()}async function loadDrafts(){const res=await fetch(API);const data=await res.json();const items=data.items||[];document.getElementById('drafts').innerHTML=items.length?items.map(d=>`<div class="draft draft-card"><div class="draft-head"><div class="data-block"><div class="state-line"><span class="status-badge ${badgeClass(d.outcome||'draft_only')}">${titleize(d.outcome||'draft_only')}</span><span class="chip">${titleize(d.channel||'email')}</span></div><div class="data-title">${d.company_name||'Untitled draft'}</div><div class="meta-stack"><div class="meta-line"><span><strong>Contact:</strong> ${d.contact_person||'Unknown'} ${d.email?`(${d.email})`:''}</span></div><div class="meta-line"><span><strong>Subject:</strong> ${d.subject||'No subject'}</span></div><div class="meta-line"><span><strong>Owner:</strong> ${d.owner||'—'}</span><span><strong>Created:</strong> ${formatRelative(d.created_at)}</span></div>${d.lead_id?`<div><a class="contact-link" href="/sales/leads/detail/?id=${d.lead_id}">Open lead detail</a></div>`:''}</div></div></div><div class="draft-copy"><div class="body-copy">${d.content||'No draft body.'}</div></div><div class="actions"><button class="btn success" onclick="setOutcome(${d.id},'approved_to_send')">Approve</button><button class="btn warn" onclick="setOutcome(${d.id},'needs_edit')">Needs edit</button><button class="btn danger" onclick="setOutcome(${d.id},'rejected')">Reject</button>${d.outcome==='approved_to_send'?`<button class="btn primary" onclick="sendDraft(${d.id})">Send now</button>`:''}</div></div>`).join(''):'<div class="item"><div class="muted">No drafts yet.</div></div>'}loadDrafts();</script><script src="/sales/shared-nav.js"></script></body></html>
