name: Deploy Production

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy"
        required: false
        default: "refs/heads/master"
      fresh:
        description: "Discard the webpack cache and build cold"
        required: false
        default: false
        type: boolean
      force:
        description: "Deploy even if nothing changed"
        required: false
        default: false
        type: boolean
      skip_smoke:
        description: "Skip the post-deploy smoke test (not recommended)"
        required: false
        default: false
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: node common/scripts/install-run-rush.js install

      - name: Test tracker, account, and tools
        run: node common/scripts/install-run-rush.js test --to @hcengineering/tracker-resources --to @hcengineering/lead-resources --to @hcengineering/account --to @hcengineering/model-tools

  deploy:
    needs: test
    if: ${{ github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HULY_VPS: ${{ secrets.HULY_VPS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install SSH key
        env:
          HULY_SSH_KEY_B64: ${{ secrets.HULY_SSH_KEY_B64 }}
        run: |
          if [ -z "${HULY_VPS:-}" ]; then
            echo "::error::HULY_VPS secret is missing"
            exit 1
          fi
          if [ -z "${HULY_SSH_KEY_B64:-}" ]; then
            echo "::error::HULY_SSH_KEY_B64 secret is missing"
            exit 1
          fi
          mkdir -p "$HOME/.ssh"
          echo "$HULY_SSH_KEY_B64" | base64 -d > "$HOME/.ssh/id_huly"
          chmod 600 "$HOME/.ssh/id_huly"
          echo "HULY_SSH_KEY=$HOME/.ssh/id_huly" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: node common/scripts/install-run-rush.js install

      # Persist the webpack filesystem cache so CI builds are incremental too.
      - name: Restore webpack cache
        uses: actions/cache@v4
        with:
          path: dev/prod/.build_prod
          key: huly-front-webpack-${{ hashFiles('dev/prod/webpack.config.js') }}-${{ github.sha }}
          restore-keys: |
            huly-front-webpack-${{ hashFiles('dev/prod/webpack.config.js') }}-
            huly-front-webpack-

      - name: Install smoke-test browser
        if: ${{ github.event.inputs.skip_smoke != 'true' }}
        run: |
          mkdir -p scripts/.deploy-tools
          cd scripts/.deploy-tools
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright
          npx playwright install --with-deps chromium

      - name: Deploy
        env:
          FRESH: ${{ github.event.inputs.fresh == 'true' && '1' || '0' }}
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
          SKIP_SMOKE: ${{ github.event.inputs.skip_smoke == 'true' && '1' || '0' }}
        run: |
          ./scripts/huly-deploy-production.sh deploy

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: scripts/_deploy-smoke/
          if-no-files-found: ignore
