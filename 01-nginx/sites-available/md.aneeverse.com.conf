server {
    listen 80;
    listen [::]:80;
    server_name md.aneeverse.com;
    client_max_body_size 25m;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/md-aneeverse;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name md.aneeverse.com;
    client_max_body_size 25m;

    ssl_certificate /etc/letsencrypt/live/md.aneeverse.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/md.aneeverse.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/md-aneeverse;
        default_type "text/plain";
        allow all;
    }

    location = / {
        auth_basic "Obsidian Access";
        auth_basic_user_file /etc/nginx/.htpasswd-md-obsidian;
        return 302 /vnc.html?autoconnect=true&resize=scale&path=websockify;
    }

    location / {
        auth_basic "Obsidian Access";
        auth_basic_user_file /etc/nginx/.htpasswd-md-obsidian;
        proxy_pass http://127.0.0.1:6080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
